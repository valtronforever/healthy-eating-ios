name: CI

on:
  # A change to README.md alone runs no build or tests.
  push:
    branches: [main]
    paths-ignore: [README.md]
  pull_request:
    paths-ignore: [README.md]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Four runners at once: the unit tests, and the UI tests split into three shards
  # (.github/scripts/ui_test_shard.py balances the test classes by their CI durations).
  test:
    name: ${{ matrix.name }}
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Unit tests, tests: unit, shard: 0 }
          - { name: UI tests 1 of 3, tests: ui, shard: 0 }
          - { name: UI tests 2 of 3, tests: ui, shard: 1 }
          - { name: UI tests 3 of 3, tests: ui, shard: 2 }
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          echo "Using $xcode"
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version

      - name: Check generated design tokens
        if: matrix.tests == 'unit'
        run: python3 design/tools/generate_design_tokens.py --check

      - name: Pick an iPhone simulator
        id: simulator
        run: |
          udid="$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((r for r in devices if "iOS" in r), key=lambda r: [int(p) for p in r.split("iOS-")[-1].split("-")])
          for runtime in reversed(runtimes):
              phones = [d for d in devices[runtime] if d["name"].startswith("iPhone")]
              if phones:
                  print(phones[0]["udid"]); break
          ')"
          xcrun simctl list devices | grep "$udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      # Simulator builds sign ad hoc ("Sign to Run Locally"), which needs no certificate.
      # Keep signing on: unsigned apps get no Keychain access, and the Keychain tests fail.
      - name: Build for testing (warnings are errors)
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project HealthyEating.xcodeproj \
            -scheme HealthyEating \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            GCC_TREAT_WARNINGS_AS_ERRORS=YES

      # Booted only after the build: booting during it (3 CPUs) slowed the build from 1.5 to
      # 4 to 7 minutes and left the simulator too busy for the first UI tests (CI run 40176477601).
      - name: Boot the simulator
        run: xcrun simctl bootstatus "${{ steps.simulator.outputs.udid }}" -b

      - name: Test
        run: |
          set -o pipefail
          if [ "${{ matrix.tests }}" = unit ]; then
            only="-only-testing:HealthyEatingTests"
          else
            only="$(python3 .github/scripts/ui_test_shard.py ${{ matrix.shard }} 3)"
          fi
          echo "Running: $only"
          xcodebuild test-without-building \
            -project HealthyEating.xcodeproj \
            -scheme HealthyEating \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            $only

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults-${{ matrix.tests }}-${{ matrix.shard }}
          path: TestResults.xcresult
          retention-days: 7
